services:
  - type: web
    name: meesho-address-shield-web
    runtime: static
    buildCommand: npm install --legacy-peer-deps && npm run build
    staticPublishPath: ./dist
    autoDeploy: true
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

  - type: worker
    name: meesho-address-shield-bot
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: python bot.py
    autoDeploy: true
    envVars:
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: APP_URL
        fromService:
          type: web
          name: meesho-address-shield-web
          property: host
