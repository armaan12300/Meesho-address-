services:
  - type: web
    name: address-manager-website
    runtime: static
    buildCommand: echo "Static site - no build required"
    staticPublishPath: ./web
    autoDeploy: true

  - type: worker
    name: address-manager-telegram-bot
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: python bot.py
    autoDeploy: true
    envVars:
      - key: TELEGRAM_BOT_TOKEN
        sync: false
